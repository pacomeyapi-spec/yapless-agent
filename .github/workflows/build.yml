name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -o yapless-agent.zip -d _src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build release APK
        working-directory: _src/yapless-agent
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p out
          cp _src/yapless-agent/app/build/outputs/apk/release/app-release*.apk out/yapless-agent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: yapless-agent-apk
          path: out/yapless-agent.apk
      - name: Publish Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Yapless Agent (derniere build)
          body: "APK agent Yapless - build automatique. Telechargez yapless-agent.apk ci-dessous."
          files: out/yapless-agent.apk
          make_latest: true
